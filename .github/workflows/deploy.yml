name: Build

# Builds both apps (permit + public) into dist/permit and dist/public.
# Hosting target is TBD — wire up an upload/deploy step for your environment
# (GitHub Pages, AGOL app, static host). Bases are /lagrange-parking/ and
# /lagrange-parking-public/ (see .env.permit / .env.public).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_ARCGIS_API_KEY: ${{ secrets.VITE_ARCGIS_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: lagrange-parking-dist
          path: dist
